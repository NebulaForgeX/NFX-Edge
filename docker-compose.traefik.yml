name: nfx-edge-traefik

# Ingress only. Host 80/443. File provider reads ./dynamic. No Docker provider and no shared network.
# Start: task traefik    Stop: task traefik:down

services:
  traefik:
    image: traefik:v3.7.13
    container_name: NFX-Edge-Reverse-Proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NAS1_IP: ${NAS1_IP}
      NAS2_IP: ${NAS2_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./websites:/certs/websites:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    command:
      - --configFile=/etc/traefik/traefik.yml
