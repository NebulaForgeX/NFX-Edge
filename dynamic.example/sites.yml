# Copy to dynamic/ and edit domains / ports:
#   cp dynamic.example/sites.yml dynamic/sites.yml
#
# Do not leave this file in dynamic/ — Traefik loads every *.yml there.
# Placeholder ports (<backend-port>) make these routers fail.
#
# TLS: dynamic/tls.yaml — sites-base writes ./websites/<site>/cert.crt + key.key.
# Traefik does not issue certificates (no certResolver).
#
# Priority: customer Host() catch-all must beat product PathPrefix (20–50),
# otherwise example.com/console/nfx-identity serves the NFX console.
# Host+PathPrefix site APIs must beat that catch-all.
#
# Active block: www + admin + same-origin API (lucaslyu-style).
# Commented block: static-only + www → apex (aquawork / timetablecraft-style).

http:
  routers:
    www-example-api:
      rule: "(Host(`example.com`) || Host(`www.example.com`)) && (PathPrefix(`/catalog`) || PathPrefix(`/auth`) || PathPrefix(`/analytics`) || PathPrefix(`/image`))"
      entryPoints:
        - websecure
      service: example-www-api-svc
      tls: {}
      priority: 300

    www-example:
      rule: "Host(`example.com`) || Host(`www.example.com`)"
      entryPoints:
        - websecure
      service: www-example-svc
      tls: {}
      priority: 200

    admin-example-api:
      rule: "Host(`admin.example.com`) && (PathPrefix(`/catalog`) || PathPrefix(`/auth`) || PathPrefix(`/analytics`) || PathPrefix(`/image`))"
      entryPoints:
        - websecure
      service: example-admin-api-svc
      tls: {}
      priority: 300

    admin-example:
      rule: "Host(`admin.example.com`)"
      entryPoints:
        - websecure
      service: admin-example-svc
      tls: {}
      priority: 200

  services:
    example-www-api-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:<backend-port>"

    www-example-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:<www-static-port>"

    example-admin-api-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:<backend-port>"

    admin-example-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:<admin-static-port>"

