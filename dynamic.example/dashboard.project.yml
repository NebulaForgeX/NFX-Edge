# Traefik dashboard. Generate the user line with: htpasswd -nbB admin <password>
http:
  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "admin:<bcrypt-hash>"
  routers:
    dashboard:
      rule: "Host(`traefik.example.com`)"
      entryPoints: [websecure]
      service: api@internal
      middlewares: [dashboard-auth]
      tls: {}
      priority: 200
    dashboard-lan:
      rule: 'HostRegexp(`^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))'
      entryPoints: [websecure]
      service: api@internal
      middlewares: [dashboard-auth]
      tls: {}
      priority: 50
