# Static sites. Not NFX product blocks. One block per site: www → apex, apex, LAN path.
# example1.com → 10400, example2.com → 10401. Copy a block for each extra site.

http:
  middlewares:
    example1-www-to-apex:
      redirectRegex:
        regex: "^https://www\\.example1\\.com/(.*)"
        replacement: "https://example1.com/${1}"
        permanent: true
    example2-www-to-apex:
      redirectRegex:
        regex: "^https://www\\.example2\\.com/(.*)"
        replacement: "https://example2.com/${1}"
        permanent: true

    lan-example1-to-port:
      redirectRegex:
        regex: "^https?://[^/]+/example1\\.com/?(.*)"
        replacement: 'http://{{ env "NAS1_IP" }}:10400/${1}'
        permanent: false
    lan-example2-to-port:
      redirectRegex:
        regex: "^https?://[^/]+/example2\\.com/?(.*)"
        replacement: 'http://{{ env "NAS1_IP" }}:10401/${1}'
        permanent: false

  routers:
    www-example1-www:
      rule: "Host(`www.example1.com`)"
      entryPoints: [websecure]
      middlewares: [example1-www-to-apex]
      service: www-example1-svc
      tls: {}
      priority: 200
    www-example1:
      rule: "Host(`example1.com`)"
      entryPoints: [websecure]
      service: www-example1-svc
      tls: {}
      priority: 200
    www-example2-www:
      rule: "Host(`www.example2.com`)"
      entryPoints: [websecure]
      middlewares: [example2-www-to-apex]
      service: www-example2-svc
      tls: {}
      priority: 200
    www-example2:
      rule: "Host(`example2.com`)"
      entryPoints: [websecure]
      service: www-example2-svc
      tls: {}
      priority: 200

    lan-example1:
      rule: 'Host(`{{ env "NAS1_IP" }}`) && PathPrefix(`/example1.com`)'
      entryPoints: [websecure]
      middlewares: [lan-example1-to-port]
      service: www-example1-svc
      tls: {}
      priority: 100
    lan-example2:
      rule: 'Host(`{{ env "NAS1_IP" }}`) && PathPrefix(`/example2.com`)'
      entryPoints: [websecure]
      middlewares: [lan-example2-to-port]
      service: www-example2-svc
      tls: {}
      priority: 100

  services:
    www-example1-svc:
      loadBalancer:
        servers:
          - url: 'http://{{ env "NAS1_IP" }}:10400'
    www-example2-svc:
      loadBalancer:
        servers:
          - url: 'http://{{ env "NAS1_IP" }}:10401'
