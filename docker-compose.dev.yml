name: nfx-edge-dev
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  sites-base:
    image: nfx-edge-sites-base:dev
    container_name: NFX-Edge-Sites-Base-Dev
    build:
      context: .
      dockerfile: inputs/sites/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/sites/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SITES}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_SITES}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_SITES}:${GRPC_PORT_SITES}"
    volumes:
      - ./websites:/app/websites:rw
      - ./acme-challenges:/acme-challenges:rw
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    develop:
      watch:
        - action: sync
          path: inputs/sites/base
          target: /app/inputs/sites/base
        - action: sync
          path: inputs/sites/configuration
          target: /app/inputs/sites/configuration
        - action: sync
          path: modules/sites
          target: /app/modules/sites
        - action: sync
          path: connections
          target: /app/connections
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/sites/configuration/Dockerfile.Base

  console:
    image: node:22-bookworm-slim
    container_name: NFX-Edge-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${VITE_PORT}"
    init: true
