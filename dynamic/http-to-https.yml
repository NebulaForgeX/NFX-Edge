# Public Hosts only: HTTP → HTTPS. LAN IP (192.168.1.64) and PathPrefix
# /nfx-* /console must stay HTTP — entrypoint-wide redirect 301/308s them.
http:
  middlewares:
    nfx-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true
  routers:
    nfx-http-to-https:
      rule: Host(`lucaslyu.com`) || Host(`www.lucaslyu.com`) || Host(`admin.lucaslyu.com`) || Host(`timetablecraft.com`) || Host(`www.timetablecraft.com`) || Host(`aquawork.ca`) || Host(`www.aquawork.ca`) || Host(`traefik.lyulucas.com`)
      entryPoints:
        - web
      middlewares:
        - nfx-redirect-https
      service: nfx-redirect-noop
      priority: 1
  services:
    nfx-redirect-noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"
