# Copy to tls.yaml and set real site folders:
#   cp dynamic/tls.example.yaml dynamic/tls.yaml
#
# certFile / keyFile are inside the container: ./websites -> /certs/websites
# Folder names match websites/<name> written by sites-base (console export / ACME apply).
# Do not list a path until the files exist — Traefik fails the whole file provider.
# Keep this example file's certificates list empty so Traefik can watch /dynamic.

tls:
  certificates:
    - certFile: /certs/websites/<site1>/cert.crt
      keyFile: /certs/websites/<site1>/key.key
    - certFile: /certs/websites/<site2>/cert.crt
      keyFile: /certs/websites/<site2>/key.key
