# NFX-Edge sites service (TLS + DNS + file + analysis)

[server]
    name = "Sites Service"
    host = "0.0.0.0"
    http_port = "${HTTP_PORT}"
    grpc_port = "${GRPC_PORT_SITES}"

    [server.access_log]
    mode = "logger"
    format = "pretty"

[postgresql]
    host = "${POSTGRESQL_HOST}"
    port = "${POSTGRESQL_PORT}"
    user = "${POSTGRESQL_USER}"
    password = "${POSTGRESQL_PASSWORD}"
    dbname = "${POSTGRESQL_NAME_PROD}"
    sslmode = "disable"
    timezone = "UTC"
    logger_level = "warn"
    auto_migrate = false

    [postgresql.connection]
        timeout = "5s"
        max_retries = 5
        retry_interval = "2s"
        max_idle_connections = 10
        max_open_connections = 100
        conn_max_idle_time = "15m"
        conn_max_lifetime = "1h"

[cache]
    host = "${REDIS_HOST}"
    port = "${REDIS_PORT}"
    password = "${REDIS_PASSWORD}"

    [cache.connection]
        dial_timeout = "3s"
        write_timeout = "3s"
        read_timeout = "3s"
        max_retries = 5
        retry_interval = "2s"

    [cache.tls]
        enabled = false
        server_name = ""

[logger]
    level = "info"
    format = "json"
    output = "stdout"
    file_path = "logs/sites.log"
    max_size_mb = 100
    max_backups = 10
    max_age_day = 30
    compress = false

[kafka]
    brokers = ["${KAFKA_BROKERS}"]
    client_id = "nfxedge-sites-service"

    [kafka.network]
        max_open_requests = 1

    [kafka.producer]
        acks = "all"
        compression = "snappy"
        retries = 3
        batch_bytes = 1048576
        linger_ms = 5
        idempotent = true

    [kafka.consumer]
        group_id = "nfxedge-sites"
        initial_offset = "latest"
        session_timeout_ms = 10000
        heartbeat_interval_ms = 3000
        fetch_min_bytes = 1
        fetch_max_bytes = 5242880
        return_errors = true

    [kafka.producer_topics]
        cert = "nfxedge.cert"
        cert_poison = "nfxedge.cert_poison"
        file = "nfxedge.file"
        file_poison = "nfxedge.file_poison"

    [kafka.consumer_topics]
        cert = "nfxedge.cert"
        cert_poison = "nfxedge.cert_poison"
        file = "nfxedge.file"
        file_poison = "nfxedge.file_poison"

    [kafka.security]
        enabled = false
        mechanism = "PLAIN"
        username = ""
        password = ""
        tls_insecure_skip_verify = false


[token]
    secret_key = "${TOKEN_SECRET_KEY}"
    issuer = "${TOKEN_ISSUER}"
    access_token_ttl = "${TOKEN_ACCESS_TTL}"
    refresh_token_ttl = "${TOKEN_REFRESH_TTL}"
    algorithm = "${TOKEN_ALGORITHM}"

[i18n]
    errors_langs_path = "errors/langs"

[grpc_client]
    auth_addr = "${GRPC_HOST_AUTH}:${GRPC_PORT_AUTH}"


[otel]
    enabled = true
    endpoint = "${OTEL_EXPORTER_OTLP_ENDPOINT}"
    insecure = true
    sampler_arg = 1.0
    traces = true
    metrics = true
    logs = true
    export_timeout = "10s"

[cert]
    base_dir = "/app"
    acme_challenge_dir = "/acme-challenges"
    max_wait_seconds = 300
    read_on_startup = true
    schedule_enabled = true
