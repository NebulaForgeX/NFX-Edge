name: nfx-edge-secure
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  sites-base:
    image: nfx-edge-sites-base:secure
    container_name: NFX-Edge-Sites-Base-Secure
    build:
      context: .
      dockerfile: inputs/sites/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SITES}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_SITES}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_SITES}:${GRPC_PORT_SITES}"
    volumes:
      - ./websites:/app/websites:rw
      - ./acme-challenges:/acme-challenges:rw
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  console:
    image: nfx-edge-console:secure
    container_name: NFX-Edge-Console-Secure
    build:
      context: ./console
      dockerfile: Dockerfile
      target: secure
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_BASE: ${VITE_BASE}
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    restart: always
