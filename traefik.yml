api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    # Do not put entrypoint-wide 80→443 here. Runtime redirect is
    # dynamic/http-to-https.yml (public Hosts only). A global redirect
    # 301/308s /nfx-* and /console on 192.168.1.64.
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    constraints: "LabelRegex(`traefik.project`, `^(nfx-edge|nfx-identity|nfx-vault|nfx-news|nfx-storages|nfx-documentation)$`)"
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Runtime ACME flags live in docker-compose.yml (this file is not mounted).
# HTTP-01 (/.well-known/acme-challenge) is NFX-Vault sites-base, not Traefik.
# Temporary certResolver sites use TLS-ALPN-01 until Vault writes /certs/websites/<site>/.
# certificatesResolvers:
