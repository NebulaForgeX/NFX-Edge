# Static config. Dynamic routers live in /etc/traefik/dynamic/*.project.yml (watch reloads them).
api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog:
  format: json

metrics:
  prometheus: {}
