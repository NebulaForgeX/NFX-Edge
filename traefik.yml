# Reference static config (compose command is what Traefik actually loads).
# https://doc.traefik.io/traefik/v3.7/reference/install-configuration/entrypoints/
api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    constraints: "LabelRegex(`traefik.project`, `^(nfx-edge|nfx-identity|nfx-news|nfx-storages|nfx-documentation)$`)"
  file:
    directory: /dynamic
    watch: true

# TLS files: ./websites/<site>/ → /certs/websites, listed in dynamic/tls.yaml.
# HTTP-01 is sites-base (no certificatesresolvers / certResolver).
# allowACMEByPass + entryPoint redirect: all :80 → :443 except /.well-known/acme-challenge/.
